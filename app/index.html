<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext x='50%25' y='50%25' font-size='20' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E" />
    <title>Offline Maps</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mapstackui-theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // localStorage/matchMedia unavailable — fall back to light, same as useThemeStore's own fallback chain.
        }
      })()
    </script>
  </head>
  <body class="m-0 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
