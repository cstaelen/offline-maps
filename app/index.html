<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapStackUI</title>
    <script>
      // Applied synchronously, before first paint, so a stored/system dark
      // preference doesn't flash light-themed content for one frame while
      // App.tsx's useEffect (which runs after React's initial commit) catches up.
      // Keep this logic in sync with app/src/store/useThemeStore.ts.
      (function () {
        try {
          var stored = localStorage.getItem('mapstackui-theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // localStorage/matchMedia unavailable — fall back to light, same as useThemeStore's own fallback chain.
        }
      })()
    </script>
  </head>
  <body class="m-0 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
